name: Build Manager Only

on:
  push:
    branches: [ "manager" ]
    paths:
      - '.github/workflows/build-manager-only.yml'
      - 'manager/**'
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spoofed: [ false, true ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Spoof Package ID
        if: matrix.spoofed == true
        working-directory: ./manager
        run: |
          chmod +x next
          ./next

      - name: Write key
        working-directory: ./manager
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE='key.jks'
            } >> gradle.properties
            echo ${{ secrets.KEYSTORE }} | base64 -d > key.jks
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download ksud from latest ThRE-Team release
        run: |
          mkdir -p aarch64-linux-android/release
          mkdir -p x86_64-linux-android/release
          LATEST=$(curl -sL "https://api.github.com/repos/ThRE-Team/KernelSU-Next/releases/latest" | grep '"tag_name"' | cut -d'"' -f4)
          echo "Latest release: $LATEST"
          curl -fSL "https://github.com/ThRE-Team/KernelSU-Next/releases/download/${LATEST}/ksud-aarch64-linux-android" \
            -o aarch64-linux-android/release/ksud
          curl -fSL "https://github.com/ThRE-Team/KernelSU-Next/releases/download/${LATEST}/ksud-x86_64-linux-android" \
            -o x86_64-linux-android/release/ksud
          ls -lh aarch64-linux-android/release/ksud x86_64-linux-android/release/ksud

      - name: Copy ksud to app jniLibs
        run: |
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          mkdir -p manager/app/src/main/jniLibs/x86_64
          cp -f aarch64-linux-android/release/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          cp -f x86_64-linux-android/release/ksud manager/app/src/main/jniLibs/x86_64/libksud.so

      - name: Build with Gradle
        working-directory: ./manager
        run: ./gradlew clean assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.spoofed && 'manager-spoofed' || 'manager' }}
          path: manager/app/build/outputs/apk/release/*.apk
