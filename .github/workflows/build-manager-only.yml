name: Build Manager Only

on:
  push:
    branches: [ "manager" ]
    paths:
      - '.github/workflows/build-manager-branch.yml'
      - 'manager/**'
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spoofed: [ false, true ]

    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Spoof Package ID
        if: matrix.spoofed == true
        run: |
          chmod +x next
          ./next

      - name: Write key
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE='key.jks'
            } >> gradle.properties
            echo ${{ secrets.KEYSTORE }} | base64 -d > key.jks
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download ksud from latest ThRE-Team release
        run: |
          mkdir -p ../aarch64-linux-android/release
          mkdir -p ../x86_64-linux-android/release
          curl -L "https://github.com/ThRE-Team/KernelSU-Next/releases/latest/download/ksud-aarch64-linux-android" \
            -o ../aarch64-linux-android/release/ksud || \
          curl -L "https://github.com/KernelSU-Next/KernelSU-Next/releases/latest/download/ksud-aarch64-linux-android" \
            -o ../aarch64-linux-android/release/ksud
          curl -L "https://github.com/ThRE-Team/KernelSU-Next/releases/latest/download/ksud-x86_64-linux-android" \
            -o ../x86_64-linux-android/release/ksud || \
          curl -L "https://github.com/KernelSU-Next/KernelSU-Next/releases/latest/download/ksud-x86_64-linux-android" \
            -o ../x86_64-linux-android/release/ksud

      - name: Copy ksud to app jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          cp -f ../aarch64-linux-android/release/ksud app/src/main/jniLibs/arm64-v8a/libksud.so
          cp -f ../x86_64-linux-android/release/ksud app/src/main/jniLibs/x86_64/libksud.so

      - name: Build with Gradle
        run: ./gradlew clean assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.spoofed && 'manager-spoofed' || 'manager' }}
          path: app/build/outputs/apk/release/*.apk
